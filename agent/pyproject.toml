[project]
name = "spare-voice"
version = "2.0.0"
description = "Voice-first, live-generated home workouts with swappable speech providers"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
voice = ["pipecat-ai[gradium,openai,silero,webrtc,local-smart-turn]==1.11.0"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.uv]
package = false
